.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.stat b{display:block;font-size:1.45rem;font-weight:800;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.alert{display:flex;gap:12px;border-radius:16px;padding:12px 14px;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-left-width:6px}

.alert.advisory{border-left-color:var(--adv)}.alert.watch{border-left-color:var(--watch)}.alert.warning{border-left-color:var(--warn)}.alert.info{border-left-color:var(--info)}

.alert.advisory .tag{color:var(--adv)}.alert.watch .tag{color:var(--watch)}.alert.warning .tag{color:var(--warn)}.alert.info .tag{color:var(--info)}

.seg{display:flex;gap:6px;flex-wrap:wrap}

.setrow{padding:12px 0;border-bottom:1px solid var(--line)}.setrow:last-child{border-bottom:0}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:750;font-size:.78rem;margin:2px 6px 2px 0;font-variant-numeric:tabular-nums}
.c-into{background:#0A6BD0;color:#fff}.c-down{background:#C7F264;color:#10210A}.c-cross{background:#FFB547;color:#2A1A00}.c-calm{background:var(--soft);color:var(--ink)}
details{border-top:1px solid var(--line)}details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px}

.pill.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.results button{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 4px;font:inherit;color:var(--ink);cursor:pointer;min-height:52px}
.results small{color:var(--muted)}
.demo{font-size:.78rem;color:var(--muted);margin:16px 2px 0}
.err{color:var(--warn);font-weight:700;font-size:.9rem}

    const cwc=Math.abs(x.cw)>=4?`<span class="chip c-cross">CROSS ${x.cw>0?"R\u2192L":"L\u2192R"} ${fW(Math.abs(x.cw))}</span>`:"";
    const D=h.p===3?h.y:S.appr,pl=x.plays(D),cl=pick(pl,h.p===3?"p3":"app"),ud=S.u.d==="yd"?"yd":"m",cv=v=>S.u.d==="yd"?v:v*0.9144;
    const adv=!comp();

      :`<p><b>Tee shot:</b> a ${fD(x.dc)} drive plays about ${fD(Math.abs(x.playsT(x.dc)-x.dc))} ${x.playsT(x.dc)-x.dc>=0?"longer":"shorter"} in these conditions.</p><p><b>Approach from ${fD(D)}:</b> plays ${fD(pl)} (${clubsTxt((pl-D)/G)}). Club: <b>${esc(cl.n)}</b>${cl.sub?` <span class="mut">(${esc(cl.sub)})</span>`:""}.</p>`;

function kitList(R,sn){
  const k=[],add=(id,t,w)=>k.push({id,t,w}),V=verdict(R),wet=R.mm>=1.5||(R.prob>=70&&R.mm>=0.5),mid=!wet&&(R.prob>=40||R.mm>=0.3);
  if(wet){add("wp","Rain jacket and pants",V.d);add("shoes","Waterproof shoes and spare socks","Wet feet cost shots as well as comfort.");add("gl","Two or three spare gloves or rain gloves","A wet glove slips; rotate them.");add("tw","Two towels, one under the bag hood","Keep the grips dry for every shot.");add("hood","Bag rain hood","Protects grips and spare gloves.");
    if(R.gust<30)add("umb","Umbrella","Gusts stay under "+fW(30)+", so one is usable.");else add("umb","Skip the umbrella; use a hooded jacket",comp()?"Strong gusts are forecast.":"Gusts reach "+fW(R.gust)+".")}
  else if(mid){add("wp","Rain jacket in the bag, pants to hand",V.d);add("gl","One spare glove","Showers are possible.");add("tw","One towel","Keep it handy.")}
  else add("shell","Light shell jacket","Rain is unlikely but a shell weighs almost nothing.");
  if(R.spd>=18||R.gust>=30){add("wind","Windproof mid-layer",comp()?"Windy conditions are forecast.":"Average "+fW(R.spd)+", gusts to "+fW(R.gust)+".");add("mk","Weighted ball marker and spare tees","Markers and tees move in strong wind.")}
  if(R.tmin<=3){add("th","Thermal base layer, hat and snood","Low of "+fT(R.tmin)+".");add("hw","Hand warmers and winter gloves","Hands lose feel quickly in the cold.")}
  else if(R.tmin<=8)add("lay","Layers: vest, ear band, winter gloves","Low of "+fT(R.tmin)+".");
  if(R.tmax>=24)add("sun","Sunscreen, cap and plenty of water","High of "+fT(R.tmax)+".");
  if(R.end>sn.set-0.5)add("day","Check the last tee time against dusk","You finish about "+fmtT(R.end)+"; sunset is about "+fmtT(sn.set)+".");
  add("bm","Ball markers, tees, divot tool and pencil","Standard competition kit.");add("balls","At least six balls","Wind and rain mean more lost balls.");
  return k;
}

   <div class="setrow"><b>Theme</b><div style="margin:8px 0 0">${seg("theme",[["auto","Auto"],["light","Light"],["dark","Dark"]],S.theme)}</div></div>
   <div class="setrow"><b>Text size</b><div style="margin:8px 0 0">${seg("size",[[0,"Standard"],[1,"Large"],[2,"Largest"]],S.size)}</div></div></div>
  <div class="card"><div class="lbl">Forecast source</div><div class="setrow" style="padding-top:0"><div style="margin:0 0 8px">${seg("live",[["true","Live forecast"],["false","Demo"]],S.live)}</div><div class="small mut">Live data is Open-Meteo for the course location, up to 16 days ahead. Demo uses the simulated days below.</div></div><div class="lbl" style="margin-top:6px">Demo days</div>
   <div class="seg" style="flex-direction:column">${Object.keys(SC).map(k=>`<button class="${S.scen===k?"on":""}" data-act="set" data-k="scen" data-v="${k}" style="text-align:left;padding:0 16px">${SC[k].n}</button>`).join("")}</div></div>
  <p class="small" style="margin:18px 4px"><a href="#feedback" data-act="fb" data-t="forecast">Send feedback</a> · <a href="#organiser">Tournament organiser tools</a></p>`;
}

function viewOrganiser(){
  const c=course(),sn=sun(c,S.date),o=S.org,N=clamp(Number(o.groups)||1,1,100),step=clamp(Number(o.interval)||10,5,20)/60,first=parseT(S.tee);
  const idxs=[...new Set([0,Math.floor((N-1)/4),Math.floor((N-1)/2),Math.floor(3*(N-1)/4),N-1])];
  const rows=idxs.map(i=>{const tee=first+i*step,r=roundSum(tee),fl=[];
    if(r.gust>=o.gustLimit)fl.push("Gusts over limit");if(r.peak>=o.rainLimit)fl.push("Heavy rain");if(r.end>sn.set-0.25)fl.push("Finishes near dusk");
    return{i,tee,r,fl}});
  const A=alerts(roundSum(first),c,sn),a0=rows[0].r,a1=rows[rows.length-1].r;
  const sum=`${c.n}, ${longDate(S.date)}. First tee ${fmtT(first)}, last group ${fmtT(first+(N-1)*step)} (${N} groups, ${n0(step*60)}-minute intervals). Early wave: ${fW(a0.spd)} from ${card(a0.dir)}, gusts ${fW(a0.gust)}. Late wave: ${fW(a1.spd)} from ${card(a1.dir)}, gusts ${fW(a1.gust)}. Sunset about ${fmtT(sn.set)}.`;
  const diff=a1.spd-a0.spd;
  return `${subHead("Organiser","settings")}
  <div class="card"><div class="lbl">Field</div>
   <div class="grid2"><div><div class="lbl">Groups</div><input type="number" inputmode="numeric" min="1" max="100" value="${o.groups}" data-bind="org" data-v="groups" aria-label="Number of groups"></div>
   <div><div class="lbl">Interval (min)</div><input type="number" inputmode="numeric" min="5" max="20" value="${o.interval}" data-bind="org" data-v="interval" aria-label="Tee interval in minutes"></div>
   <div><div class="lbl">Gust limit (mph)</div><input type="number" inputmode="numeric" min="10" max="80" value="${o.gustLimit}" data-bind="org" data-v="gustLimit" aria-label="Committee gust limit in mph"></div>
   <div><div class="lbl">Rain limit (mm/h)</div><input type="number" inputmode="decimal" step="0.5" min="0.5" max="10" value="${o.rainLimit}" data-bind="org" data-v="rainLimit" aria-label="Committee rain limit in mm per hour"></div></div>
   <p class="small mut" style="margin:10px 0 0">First tee ${S.tee} on the home page. Limits are your Committee’s own thresholds; this tool only flags them.</p></div>
  ${A.list.map(a=>`<div class="alert ${a.l}"><div class="tag">${a.tag}</div><div><b>${esc(a.t)}</b><span class="small mut">${esc(a.d)}</span></div></div>`).join("")}
  <div class="card"><div class="lbl">Conditions across the draw</div><table><thead><tr><th>Group</th><th>Tee</th><th class="n">Wind</th><th class="n">Gust</th><th class="n">Rain</th></tr></thead><tbody>
   ${rows.map(x=>`<tr><td>${x.i+1}</td><td>${fmtT(x.tee)}</td><td class="n">${fW(x.r.spd)}</td><td class="n">${fW(x.r.gust)}</td><td class="n">${fR(x.r.mm)}</td></tr>${x.fl.length?`<tr><td colspan="5" class="small" style="color:var(--watch)"><b>Flag:</b> ${x.fl.join(" · ")}</td></tr>`:""}`).join("")}</tbody></table>
   <p style="margin:12px 0 0"><b>Draw difference:</b> the last wave plays in a wind about ${fW(Math.abs(diff))} ${diff>=0?"stronger":"lighter"} than the first.</p></div>
  <div class="card"><div class="lbl">Summary to share</div><p id="osum" class="small">${esc(sum)}</p><button class="btn sm" data-act="copy">Copy summary</button> <span class="small mut" id="cmsg"></span></div>`;
}

const VIEWS={feedback:viewFeedback,home:viewHome,course:viewCourse,holes:viewHoles,clubs:viewClubs,bag:viewBag,kit:viewKit,travel:viewTravel,settings:viewSettings,organiser:viewOrganiser};
const route=()=>{const r=(location.hash||"#home").slice(1);return VIEWS[r]?r:"home"};
function applyLook(){
  const rt=document.documentElement;if(S.theme==="auto")rt.removeAttribute("data-theme");else rt.setAttribute("data-theme",S.theme);
  rt.style.fontSize=[16,18,20][Number(S.size)||0]+"px";
}
function initOpenHole(d){
  const R=roundSum(),N=layoutFor(course()).holes.length,i=+d.dataset.hole,t=R.tee+R.dur*(i+0.5)/N,box=d.querySelector(".mapbox");
  if(box)makeMap(box,{mode:"hole",idx:i,timeFn:()=>t});
}
function initMapsForRoute(){
  clearMaps();const r=route();
  if(r==="home"){const b=document.getElementById("h1box");if(b)makeMap(b,{mode:"hole",idx:HV,timeFn:()=>MT});const rb=document.getElementById("rnbox");if(rb)makeRain(rb);mapReadout()}
  else if(r==="course"){const b=document.getElementById("cbox");if(b)makeMap(b,{mode:"course",timeFn:()=>MT});mapReadout()}
  else if(r==="holes"){const d=document.querySelector("details[data-hole][open]");if(d)initOpenHole(d)}
}
function render(keepScroll){
  const y=window.scrollY,r=route(),app=document.getElementById("app");applyLook();clearMaps();
  try{app.innerHTML=VIEWS[r]()}catch(e){app.innerHTML='<div class="card"><b>Something went wrong.</b><p class="small mut">'+esc(e&&e.message||e)+'</p><a class="btn" href="#home">Back to start</a></div>'}
  const cm=comp();document.getElementById("hin").innerHTML=`<a class="logo" href="#home" aria-label="Windward home">${LOGO}Windward</a><div style="display:flex;gap:8px;align-items:center"><button class="cpill${cm?" on":""}" data-act="comp" aria-pressed="${cm}">Competition ${cm?(S.comp?"on":"auto"):"off"}</button>${r==="home"?`<a class="iconbtn" href="#settings" aria-label="Settings">${ico("gear")}</a>`:`<a class="iconbtn" href="#home" aria-label="Home">${ico("wind")}</a>`}</div>`;
  document.title=r==="home"?"Windward: pre-round conditions for golfers":"Windward · "+r;
  loadLive(course());if(["home","course","holes","clubs"].includes(r))loadReal(course());
  initMapsForRoute();
  window.scrollTo(0,keepScroll?y:0);
}
/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==="loc"){e.preventDefault();try{navigator.geolocation.getCurrentPosition(p=>{S.loc=[p.coords.latitude,p.coords.longitude];S.locMsg="";render(true)},()=>{S.loc=null;S.locMsg="Location is not available here, so featured courses are shown.";render(true)},{timeout:8000})}catch(x){S.locMsg="Location is not available here, so featured courses are shown.";render(true)}return}
  if(a==="pick"){HV=0;S.course=v;S.search=false;S.q="";MT=0;save();render();return}
  if(a==="addcustom"){const la=parseFloat(document.getElementById("clat").value),lo=parseFloat(document.getElementById("clon").value),er=document.getElementById("cerr");
    if(!(la>=-90&&la<=90)||!(lo>=-180&&lo<=180)||isNaN(la)||isNaN(lo)){er.textContent="Enter valid latitude and longitude.";return}
    const nm=(S.q||"Custom course").trim().slice(0,60),id="c"+hash(nm+la+lo);
    if(!S.custom.find(x=>x.id===id))S.custom.push({id,n:nm,place:"Custom",cc:"CUS",lat:la,lon:lo,tz:Math.abs(lo)<8&&la>35?"uk":lo<-100?"pt":lo<-60?"et":"uk"});
    HV=0;S.course=id;S.search=false;S.q="";MT=0;save();render();return}
  if(a==="hole"){const R=roundSum(),N=layoutFor(course()).holes.length;HV=(HV+Number(v)+N)%N;MT=holeTime(HV,R,N);const sl=document.getElementById("mt");if(sl)sl.value=MT;flickMap();return}
  if(a==="filter")S.filter=v;
  else if(a==="comp")S.comp=!S.comp;
  else if(a==="appr")S.appr=Number(v);
  else if(a==="preset"){S.bag=PRESETS[v].ids.slice();S.rating=null}
  else if(a==="rate")S.rating=rateBag();
  else if(a==="apply"){const ad=b.dataset.add,rm=b.dataset.rm;if(rm)S.bag=S.bag.filter(x=>x!==rm);if(ad&&!S.bag.includes(ad)&&S.bag.length<14)S.bag.push(ad);S.rating=rateBag()}
  else if(a==="fb"){S.fbType=b.dataset.t||"forecast";S.fbHole=b.dataset.h!==undefined?Number(b.dataset.h):null;location.hash="feedback";return}
  else if(a==="fbcopy"||a==="fbsend"){const t=fbText(),m=document.getElementById("fbmsg"),say=x=>{if(m)m.textContent=x},cp=()=>{try{navigator.clipboard.writeText(t).then(()=>say("Copied. Paste it into an email or message."),()=>say("Select the preview below and copy it."))}catch(x){say("Select the preview below and copy it.")}};
    if(a==="fbcopy"){cp();return}
    if(FEEDBACK_EMAIL){location.href="mailto:"+FEEDBACK_EMAIL+"?subject="+encodeURIComponent("Windward feedback")+"&body="+encodeURIComponent(t);return}
    if(navigator.share){navigator.share({title:"Windward feedback",text:t}).catch(()=>{})}else cp();return}
  else if(a==="copycite"){const t=S.rating?S.rating.brands.filter(x=>!x.gen).map(x=>citeOf(x.pos)+"\n"+citeOf(x.neg)).join("\n"):"",m=document.getElementById("citemsg");
    try{navigator.clipboard.writeText(t).then(()=>{if(m)m.textContent="Copied."},()=>{if(m)m.textContent="Select the list above to copy."})}catch(x){if(m)m.textContent="Select the list above to copy."}return}
  else if(a==="copy"){const t=document.getElementById("osum").textContent,m=document.getElementById("cmsg");
    try{navigator.clipboard.writeText(t).then(()=>{m.textContent="Copied."},()=>{m.textContent="Select the text above to copy."})}catch(x){m.textContent="Select the text above to copy."}return}
  else if(a==="set"){const k=b.dataset.k;
    if(k==="shape")S.shape=v;else if(k==="flight")S.flight=v;else if(k==="gust")S.gust=v==="true";
    else if(k==="ut")S.u.t=v;else if(k==="uw")S.u.w=v;else if(k==="ud")S.u.d=v;else if(k==="group")S.group=Number(v);
    else if(k==="comp")S.comp=v==="true";else if(k==="compauto")S.compAuto=v==="true";
    else if(k==="live"){S.live=v==="true"}
    else if(k==="theme")S.theme=v;else if(k==="size")S.size=Number(v);else if(k==="scen"){S.scen=v;MT=0}
    S.rating=null;}
  save();render(true);
});
function flickMap(){
  const b=document.getElementById("h1box");if(!b)return;clearMaps();
  makeMap(b,{mode:"hole",idx:HV,timeFn:()=>MT});const rb=document.getElementById("rnbox");if(rb)makeRain(rb);mapReadout();
}
let TX=null;
document.addEventListener("touchstart",e=>{TX=e.target.closest&&e.target.closest("#h1box")&&e.touches[0]?e.touches[0].clientX:null},{passive:true});
document.addEventListener("touchend",e=>{if(TX===null)return;const dx=(e.changedTouches[0]?e.changedTouches[0].clientX:TX)-TX;TX=null;
  if(Math.abs(dx)>50){const R=roundSum(),N=layoutFor(course()).holes.length;HV=(HV+(dx<0?1:-1)+N)%N;MT=holeTime(HV,R,N);const sl=document.getElementById("mt");if(sl)sl.value=MT;flickMap()}},{passive:true});
document.addEventListener("input",e=>{
  const t=e.target,k=t.dataset&&t.dataset.live;if(!k)return;
  if(k==="mt"){MT=Number(t.value);mapReadout();redrawAll()}
  else if(k==="fbm"){S.fbMsg=t.value;const pv=document.getElementById("fbprev");if(pv)pv.textContent=fbText()}
  else if(k==="q"){S.q=t.value;const r=document.getElementById("res");if(r)r.innerHTML=searchRes(S.q)}
});
document.addEventListener("toggle",e=>{
  const d=e.target;if(!d||!d.matches||!d.matches("details[data-hole]"))return;
  if(d.open){document.querySelectorAll("details[data-hole][open]").forEach(o=>{if(o!==d)o.open=false});initOpenHole(d)}
  else{const cv=d.querySelector("canvas");if(cv)MAPS.delete(cv)}
},true);
document.addEventListener("change",e=>{
  const t=e.target,k=t.dataset&&t.dataset.bind;if(!k)return;const v=t.dataset.v;
  switch(k){
    case"course":if(t.value==="__other"){S.search=true}else{HV=0;S.course=t.value;S.search=false;MT=0;save()}break;
    case"date":if(t.value)S.date=t.value;break;
    case"tee":if(t.value){S.tee=t.value;MT=0}break;
    case"fbtype":S.fbType=t.value;break;
    case"fbdiag":S.fbDiag=t.checked;break;
    case"chk":S.checks[v]=t.checked;save();return;
    case"club":if(t.checked){if(S.bag.length<14&&!S.bag.includes(v))S.bag.push(v)}else S.bag=S.bag.filter(x=>x!==v);S.rating=null;save();break;
    case"carry":{const n=Number(t.value);S.club[v].carry=clamp(isFinite(n)&&n>0?toYd(n):0,0,400);S.rating=null;save();break}
    case"brand":S.club[v].brand=t.value;save();return;
    case"model":S.club[v].model=t.value.trim().slice(0,40);save();return;
    case"age":S.club[v].age=t.value===""?"":String(clamp(Number(t.value)||0,0,40));save();return;
    case"drive":S.drive=clamp(Number(t.value)||0,0,600);save();break;
    case"buffer":S.buffer=Number(t.value);save();break;
    case"warm":S.warm[v]=t.checked;save();break;
    case"need":S.needs[v]=t.checked;save();break;
    case"org":S.org[v]=Number(t.value)||S.org[v];save();break;
  }
  render(true);
});
let rz=0;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>initMapsForRoute(),200)});
window.addEventListener("hashchange",()=>render());
render();
</script>
<script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js")}catch(e){}})}</script>
